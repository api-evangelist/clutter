aid: clutter
name: Clutter
description: 'Clutter is a full-service, on-demand storage and moving company (clutter.com)
  that picks up, professionally packs and photo-catalogs customers'' belongings, stores
  them in secure 24/7-monitored warehouses, and redelivers individual items on demand.
  Founded in 2013 and once a SoftBank-backed unicorn, Clutter merged with MakeSpace
  and was acquired by Iron Mountain in 2023; it now operates as "Clutter by Iron Mountain"
  serving major US metros and Toronto. This is a consumer-facing services company with
  a customer account portal and booking flow but no public developer program or API;
  the record is maintained in the API Evangelist network for company/portfolio tracking.'
